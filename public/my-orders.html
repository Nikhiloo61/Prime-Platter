<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Prime Platter</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        Prime Platter
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#restaurants">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#menu">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="my-orders.html">My Orders</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3" id="auth-nav-container">
          <button class="btn btn-outline-danger rounded-pill" id="btn-login">Login</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Orders Container -->
  <main class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Your Food Orders</h2>
        <p class="text-muted mb-0">View all your previous deliveries and track live orders</p>
      </div>
      <a href="index.html#menu" class="btn btn-danger rounded-pill px-4 mt-3 mt-sm-0">
        <i class="bi bi-plus-lg me-1"></i> Order Food
      </a>
    </div>

    <div id="orders-list-container">
      <!-- Loading State -->
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-danger mb-3" role="status"></div>
        <p>Loading your orders...</p>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 start-0 p-3" id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    if (!api.isAuthenticated()) {
      window.location.href = "login.html?redirect=my-orders.html";
    }

    function showToast(msg, type = "success") {
      const tc = document.getElementById("toast-container");
      const id = "toast-" + Date.now();
      const bg = type === "success" ? "bg-success" : "bg-danger";
      const html = `
        <div id="${id}" class="toast align-items-center text-white ${bg} border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">${msg}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;
      tc.insertAdjacentHTML("beforeend", html);
      const el = document.getElementById(id);
      const t = new bootstrap.Toast(el, { delay: 3500 });
      t.show();
      el.addEventListener("hidden.bs.toast", () => el.remove());
    }

    async function loadOrders() {
      const container = document.getElementById("orders-list-container");

      try {
        const res = await api.getMyOrders();
        const orders = res.orders || [];

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="custom-card p-5 text-center text-muted">
              <i class="bi bi-bag-x fs-1 d-block mb-3 text-secondary"></i>
              <h4 class="fw-bold text-dark">No orders yet</h4>
              <p class="text-muted mb-4">Looks like you haven't placed any delicious orders with Prime Platter yet.</p>
              <a href="index.html#menu" class="btn btn-danger rounded-pill px-4">Browse Menu & Order Now</a>
            </div>`;
          return;
        }

        container.innerHTML = "";

        orders.forEach((order) => {
          const date = new Date(order.createdAt).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });

          const statusClass =
            order.orderStatus === "Delivered" ? "bg-success"
            : order.orderStatus === "Cancelled" ? "bg-secondary"
            : "bg-danger";

          const itemsText = order.items
            .map((i) => `${i.quantity}x ${i.name}`)
            .join(", ");

          const card = `
            <div class="custom-card p-4 mb-4">
              <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 border-bottom mb-3">
                <div>
                  <span class="text-muted small">Order ID</span>
                  <h5 class="fw-bold mb-0 text-dark">${order.orderId}</h5>
                  <small class="text-muted">${date}</small>
                </div>
                <div class="mt-2 mt-sm-0 text-sm-end">
                  <span class="badge ${statusClass} rounded-pill px-3 py-2 mb-1">${order.orderStatus}</span>
                  <div class="small text-muted">Paid via ${order.paymentInfo.method} (${order.paymentInfo.status})</div>
                </div>
              </div>

              <div class="mb-3">
                <p class="text-muted small mb-1 fw-semibold">Ordered Items:</p>
                <p class="mb-0 text-truncate" style="max-width: 100%;">${itemsText}</p>
              </div>

              <div class="d-flex flex-wrap justify-content-between align-items-center pt-3 border-top">
                <div class="mb-2 mb-sm-0">
                  <span class="text-muted small d-block">Total Amount</span>
                  <h5 class="fw-bold text-danger mb-0">₹${order.pricing.total}</h5>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="reorderItems('${order.orderId}')">
                    <i class="bi bi-arrow-repeat me-1"></i> Reorder
                  </button>
                  <a href="order-details.html?id=${order.orderId}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    View Details
                  </a>
                  <a href="order-tracking.html?id=${order.orderId}" class="btn btn-danger btn-sm rounded-pill px-3">
                    <i class="bi bi-geo-alt me-1"></i> Track Order
                  </a>
                </div>
              </div>
            </div>`;
          container.insertAdjacentHTML("beforeend", card);
        });
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger" role="alert">
            Failed to load orders: ${err.message}
          </div>`;
      }
    }

    async function reorderItems(orderId) {
      try {
        await api.reorder(orderId);
        showToast("Items added to your cart!");
        setTimeout(() => {
          window.location.href = "checkout.html";
        }, 800);
      } catch (err) {
        showToast(err.message || "Failed to reorder", "danger");
      }
    }

    document.addEventListener("DOMContentLoaded", loadOrders);
  </script>
</body>
</html>
