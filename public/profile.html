<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Prime Platter</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        Prime Platter
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#restaurants">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#menu">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-danger rounded-pill" onclick="api.logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Profile Content -->
  <main class="container my-5">
    <div class="row g-4">
      <!-- Profile Sidebar -->
      <div class="col-lg-4">
        <div class="custom-card p-4 text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-danger bg-opacity-10 text-danger mb-3">
            <i class="bi bi-person-circle fs-1"></i>
          </div>
          <h4 class="fw-bold mb-1" id="profile-name-display">Loading...</h4>
          <p class="text-muted small mb-2" id="profile-email-display">user@example.com</p>
          <span class="badge bg-danger rounded-pill px-3 py-2" id="profile-role-badge">Customer</span>

          <hr class="my-4 text-muted">

          <div class="d-grid gap-2">
            <a href="my-orders.html" class="btn btn-outline-secondary rounded-pill text-start px-3 py-2">
              <i class="bi bi-bag-check text-danger me-2"></i> View Order History
            </a>
            <a href="index.html#menu" class="btn btn-outline-secondary rounded-pill text-start px-3 py-2">
              <i class="bi bi-shop text-danger me-2"></i> Explore Restaurant Menu
            </a>
            <button class="btn btn-danger rounded-pill text-start px-3 py-2 text-white" onclick="api.logout()">
              <i class="bi bi-box-arrow-right me-2"></i> Sign Out
            </button>
          </div>
        </div>
      </div>

      <!-- Main Profile Forms -->
      <div class="col-lg-8">
        <!-- Personal Details Card -->
        <div class="custom-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-person-lines-fill text-danger me-2"></i>Personal Information</h5>
          </div>

          <form id="profile-info-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="prof-name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="prof-name" required>
              </div>
              <div class="col-md-6">
                <label for="prof-phone" class="form-label fw-semibold">Phone Number</label>
                <input type="tel" class="form-control" id="prof-phone" required>
              </div>
              <div class="col-12">
                <label for="prof-email" class="form-label fw-semibold">Email Address (Read-only)</label>
                <input type="email" class="form-control bg-light" id="prof-email" disabled>
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-danger rounded-pill px-4" id="save-profile-btn">
                Save Changes
              </button>
            </div>
          </form>
        </div>

        <!-- Saved Delivery Addresses Card -->
        <div class="custom-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-geo-alt-fill text-danger me-2"></i>Saved Delivery Addresses</h5>
            <button class="btn btn-sm btn-outline-danger rounded-pill" data-bs-toggle="modal" data-bs-target="#addressModal">
              <i class="bi bi-plus-lg me-1"></i> Add New Address
            </button>
          </div>

          <div id="address-list-container">
            <!-- Dynamically loaded addresses -->
            <div class="text-center py-4 text-muted">
              <i class="bi bi-house-door fs-1 d-block mb-2 text-secondary"></i>
              No saved addresses found. Add one for quick checkout!
            </div>
          </div>
        </div>

        <!-- Change Password Card -->
        <div class="custom-card p-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock-fill text-danger me-2"></i>Change Password</h5>

          <form id="change-password-form">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="current-pass" class="form-label fw-semibold">Current Password</label>
                <input type="password" class="form-control" id="current-pass" required placeholder="••••••••">
              </div>
              <div class="col-md-4">
                <label for="new-pass" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control" id="new-pass" required minlength="6" placeholder="Min 6 characters">
              </div>
              <div class="col-md-4">
                <label for="confirm-new-pass" class="form-label fw-semibold">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm-new-pass" required minlength="6" placeholder="Re-type password">
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-outline-danger rounded-pill px-4" id="change-pass-btn">
                Update Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Address Modal -->
  <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-danger" id="addressModalLabel">Add Delivery Address</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="add-address-form">
          <div class="modal-body py-3">
            <div class="mb-3">
              <label for="addr-street" class="form-label fw-semibold">Street Address / Flat / Floor</label>
              <input type="text" class="form-control" id="addr-street" required placeholder="Flat 402, Sunshine Heights">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label for="addr-city" class="form-label fw-semibold">City</label>
                <input type="text" class="form-control" id="addr-city" required placeholder="New Delhi">
              </div>
              <div class="col-md-6">
                <label for="addr-state" class="form-label fw-semibold">State</label>
                <input type="text" class="form-control" id="addr-state" required placeholder="Delhi">
              </div>
            </div>
            <div class="mb-3">
              <label for="addr-pincode" class="form-label fw-semibold">Pincode</label>
              <input type="text" class="form-control" id="addr-pincode" required placeholder="110001">
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="addr-is-default" checked>
              <label class="form-check-label text-muted small" for="addr-is-default">Make this my default delivery address</label>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger rounded-pill px-4">Save Address</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 start-0 p-3" id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    // Guard: Redirect to login if unauthenticated
    if (!api.isAuthenticated()) {
      window.location.href = "login.html?redirect=profile.html";
    }

    // Toast helper
    function showNotification(msg, type = "success") {
      const tc = document.getElementById("toast-container");
      const id = "toast-" + Date.now();
      const bg = type === "success" ? "bg-success" : "bg-danger";
      const icon = type === "success" ? "bi-check-circle-fill" : "bi-x-circle-fill";
      const html = `
        <div id="${id}" class="toast align-items-center text-white ${bg} border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body"><i class="bi ${icon} me-2"></i> ${msg}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;
      tc.insertAdjacentHTML("beforeend", html);
      const el = document.getElementById(id);
      const t = new bootstrap.Toast(el, { delay: 3500 });
      t.show();
      el.addEventListener("hidden.bs.toast", () => el.remove());
    }

    // Load Profile Data
    async function loadProfile() {
      try {
        const user = await api.getProfile();
        document.getElementById("profile-name-display").textContent = user.name;
        document.getElementById("profile-email-display").textContent = user.email;
        document.getElementById("profile-role-badge").textContent = user.role.toUpperCase();

        document.getElementById("prof-name").value = user.name;
        document.getElementById("prof-phone").value = user.phone;
        document.getElementById("prof-email").value = user.email;

        renderAddresses(user.addresses || []);
      } catch (err) {
        showNotification("Failed to load profile details", "danger");
      }
    }

    // Render Addresses
    function renderAddresses(addresses) {
      const container = document.getElementById("address-list-container");
      if (!addresses || addresses.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4 text-muted">
            <i class="bi bi-house-door fs-1 d-block mb-2 text-secondary"></i>
            No saved addresses found. Add one for quick checkout!
          </div>`;
        return;
      }

      container.innerHTML = "";
      addresses.forEach((addr) => {
        const defaultBadge = addr.isDefault
          ? '<span class="badge bg-success ms-2">Default</span>'
          : `<button class="btn btn-sm btn-link text-decoration-none text-muted p-0 ms-2" onclick="makeDefaultAddress('${addr._id}')">Make Default</button>`;

        const item = `
          <div class="border rounded-3 p-3 mb-3 d-flex justify-content-between align-items-center">
            <div>
              <div class="d-flex align-items-center mb-1">
                <i class="bi bi-geo-alt text-danger me-2"></i>
                <span class="fw-semibold">${addr.street}</span>
                ${defaultBadge}
              </div>
              <p class="text-muted small mb-0 ms-4">${addr.city}, ${addr.state} - ${addr.pincode}</p>
            </div>
            <div>
              <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="deleteAddressItem('${addr._id}')" aria-label="Delete address">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>`;
        container.insertAdjacentHTML("beforeend", item);
      });
    }

    // Update Profile Info Form
    document.getElementById("profile-info-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("prof-name").value.trim();
      const phone = document.getElementById("prof-phone").value.trim();
      const btn = document.getElementById("save-profile-btn");

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
        await api.updateProfile({ name, phone });
        showNotification("Profile updated successfully!");
        loadProfile();
      } catch (err) {
        showNotification(err.message || "Failed to update profile", "danger");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Save Changes";
      }
    });

    // Add Address Form
    document.getElementById("add-address-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const street = document.getElementById("addr-street").value.trim();
      const city = document.getElementById("addr-city").value.trim();
      const state = document.getElementById("addr-state").value.trim();
      const pincode = document.getElementById("addr-pincode").value.trim();
      const isDefault = document.getElementById("addr-is-default").checked;

      try {
        await api.addAddress({ street, city, state, pincode, isDefault });
        showNotification("Address added successfully!");
        const modal = bootstrap.Modal.getInstance(document.getElementById("addressModal"));
        modal.hide();
        document.getElementById("add-address-form").reset();
        loadProfile();
      } catch (err) {
        showNotification(err.message || "Failed to add address", "danger");
      }
    });

    // Make Default Address
    async function makeDefaultAddress(addressId) {
      try {
        await api.setDefaultAddress(addressId);
        showNotification("Default address updated!");
        loadProfile();
      } catch (err) {
        showNotification(err.message || "Failed to update default address", "danger");
      }
    }

    // Delete Address
    async function deleteAddressItem(addressId) {
      if (!confirm("Are you sure you want to delete this delivery address?")) return;
      try {
        await api.deleteAddress(addressId);
        showNotification("Address removed");
        loadProfile();
      } catch (err) {
        showNotification(err.message || "Failed to remove address", "danger");
      }
    }

    // Change Password Form
    document.getElementById("change-password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById("current-pass").value;
      const newPassword = document.getElementById("new-pass").value;
      const confirmPassword = document.getElementById("confirm-new-pass").value;
      const btn = document.getElementById("change-pass-btn");

      if (newPassword !== confirmPassword) {
        showNotification("New passwords do not match", "danger");
        return;
      }

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';
        await api.changePassword({ currentPassword, newPassword, confirmPassword });
        showNotification("Password changed successfully!");
        document.getElementById("change-password-form").reset();
      } catch (err) {
        showNotification(err.message || "Failed to change password", "danger");
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Update Password";
      }
    });

    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
